<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna — Inventário de Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bordo:#6B1E2E; --bordo-dark:#4A1220; --bordo-light:#8B3345;
    --creme:#F5EFE4; --creme-dark:#EDE4D4; --marrom:#A0785A;
    --marrom-light:#C4A882; --marrom-dark:#7A5840;
    --text:#2C1810; --text-light:#6B4F3A; --white:#FDFAF6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden;max-width:100vw}
  body{font-family:'Jost',sans-serif;background:var(--creme);color:var(--text);min-height:100vh}
  a{color:inherit}

  #carregandoOverlay{position:fixed;inset:0;z-index:99999;background:linear-gradient(145deg,#4A1220 0%,#2C0A14 60%,#1A0008 100%);display:flex;align-items:center;justify-content:center;color:#C4A882;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:20px}

  #appRoot{display:none}
  .app-shell{display:flex;align-items:stretch;min-height:100vh}
  .sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--bordo-dark),var(--bordo) 60%,var(--marrom-dark));display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:150;box-shadow:0 8px 32px rgba(44,24,16,.18)}
  .side-header{padding:24px 20px 16px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.12)}
  .side-header .brand{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.3rem;color:var(--creme)}
  .side-header .brand-sub{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--marrom-light);margin-top:-2px}
  .side-header .field{margin-top:14px;margin-bottom:0}
  .side-header .field label{color:var(--marrom-light)}
  .side-header select.inp{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:var(--creme)}
  .side-header select.inp option{color:var(--text)}
  .side-links{padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
  .hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:var(--creme);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.76rem;text-decoration:none;display:flex;align-items:center;gap:6px;transition:background .15s;width:100%;text-align:left}
  .hbtn:hover{background:rgba(255,255,255,.2)}
  nav.tabs{display:flex;flex-direction:column;gap:2px;background:none;border:none;padding:10px 12px;overflow-y:auto;flex:1}
  .tab{padding:11px 14px;font-size:.82rem;font-weight:500;color:var(--marrom-light);cursor:pointer;border-left:3px solid transparent;border-radius:8px;white-space:normal;line-height:1.3;transition:all .15s}
  .tab:hover{color:var(--creme);background:rgba(255,255,255,.08)}
  .tab.active{color:var(--creme);border-left-color:var(--creme);background:rgba(255,255,255,.14);font-weight:600}
  .sidebar-close{display:none}
  .content-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
  .mobile-topbar{display:none}
  main{max-width:1180px;margin:0 auto;padding:28px 26px 60px;width:100%}
  .card{background:var(--white);border:1px solid var(--creme-dark);border-radius:12px;padding:22px;margin-bottom:18px}
  .card h2{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--bordo-dark);margin-bottom:14px}
  .card h3{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--bordo-dark);margin:18px 0 10px}
  .card p.hint{font-size:.82rem;color:var(--text-light);margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);font-weight:500}
  .inp,select.inp,textarea.inp{padding:9px 12px;border:1.5px solid var(--creme-dark);border-radius:7px;font-family:'Jost',sans-serif;font-size:.85rem;color:var(--text);background:var(--white)}
  .inp:focus{outline:none;border-color:var(--marrom)}
  .btn{background:var(--bordo);color:var(--creme);border:none;padding:10px 18px;border-radius:7px;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--bordo-dark)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-outline{background:none;border:1.5px solid var(--bordo);color:var(--bordo)}
  .btn-outline:hover{background:var(--bordo);color:var(--creme)}
  .btn-danger{background:none;border:none;color:#B43C3C;cursor:pointer;font-size:.85rem}
  .btn-sm{padding:6px 12px;font-size:.72rem}

  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;min-width:520px;border-collapse:collapse;font-size:.82rem}
  th{text-align:left;padding:9px 10px;background:var(--creme);color:var(--text-light);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
  td{padding:9px 10px;border-top:1px solid var(--creme-dark);vertical-align:middle}
  tr.inativo td{color:var(--text-light);opacity:.6}
  tr:hover td{background:#faf8f5}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:600;white-space:nowrap}
  .badge-andamento{background:#EAF2FB;color:#2E6DA4}
  .badge-concluido{background:#E8F8F0;color:#27AE60}
  .badge-semanal{background:var(--creme);color:var(--text-light)}
  .badge-mensal{background:#FEF6E7;color:#B8860B}

  .alert-banner{border-radius:12px;padding:16px 18px;margin-bottom:18px;font-size:.85rem;line-height:1.5;border:1px solid}
  .alert-banner.warn{background:#FEF6E7;border-color:#F0D9A0;color:#8A6A16}
  .alert-banner.info{background:#EAF2FB;border-color:#BFD8F0;color:#2E6DA4}
  .alert-banner.ok{background:#E8F8F0;border-color:#B7E4C7;color:#2D6A4F}
  .alert-banner h4{font-family:'Cormorant Garamond',serif;font-size:1.05rem;margin-bottom:6px;font-weight:600}

  .empty{text-align:center;padding:40px;color:var(--text-light);font-size:.85rem}
  .loading{text-align:center;padding:30px;color:var(--text-light)}

  .categoria-titulo{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--bordo-dark);margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--creme-dark);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .categoria-titulo:first-child{margin-top:0}
  .categoria-titulo .cat-repetir{font-size:.68rem;font-weight:600;color:var(--marrom-dark);cursor:pointer;text-transform:uppercase;letter-spacing:.04em;background:none;border:none}
  .categoria-titulo .cat-repetir:hover{color:var(--bordo)}

  .item-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--creme-dark)}
  .item-row:last-child{border-bottom:none}
  .item-row .item-nome{flex:1;font-size:.85rem}
  .item-row .item-nome .item-inativo-tag{font-size:.65rem;color:#B8860B;background:#FEF6E7;padding:1px 7px;border-radius:10px;margin-left:6px;text-transform:uppercase;letter-spacing:.03em}
  .item-row .item-anterior{font-size:.68rem;color:var(--text-light);min-width:90px;text-align:right}
  .item-row input.item-qtd{width:90px;padding:7px 8px;border:1.5px solid var(--creme-dark);border-radius:6px;font-size:.85rem;text-align:right}
  .item-row input.item-qtd.replicado{background:#EAF2FB;border-color:#BFD8F0}
  .item-row .item-unid{font-size:.72rem;color:var(--text-light);min-width:44px}
  .item-row .item-repetir{background:none;border:none;color:var(--marrom-dark);cursor:pointer;font-size:.85rem;padding:2px 4px}
  .item-row .item-repetir:disabled{opacity:.25;cursor:default}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(44,24,16,.5);z-index:500;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.show{display:flex}
  .modal{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--white);border-radius:14px;padding:26px}
  .modal h3{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--bordo-dark);margin-bottom:14px}
  .modal-actions{display:flex;gap:10px;margin-top:16px}
  .modal-close{background:none;border:none;color:var(--marrom-dark);text-decoration:underline;cursor:pointer;font-size:.78rem;display:block;margin:14px auto 0}
  .msg{font-size:.78rem;margin-top:8px;display:none}
  .msg.show{display:block}
  .msg.err{color:#B43C3C}
  .msg.ok{color:#27AE60}

  @media(max-width:900px){
    .app-shell{display:block}
    .sidebar{position:fixed;left:-270px;top:0;height:100vh;transition:left .25s ease;width:260px}
    .sidebar.open{left:0}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:140}
    .sidebar-overlay.show{display:block}
    .sidebar-close{display:flex;align-items:center;justify-content:center;position:absolute;top:14px;right:12px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);color:var(--creme);border:none;cursor:pointer;font-size:1rem;z-index:2}
    .mobile-topbar{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--bordo-dark),var(--bordo));padding:0 16px;height:54px;position:sticky;top:0;z-index:120;box-shadow:0 2px 14px rgba(74,18,32,.25)}
    .mobile-topbar .hamb{background:rgba(255,255,255,.12);border:none;color:var(--creme);width:34px;height:34px;border-radius:8px;font-size:1.1rem;cursor:pointer;flex-shrink:0}
    .mobile-topbar .brand{font-size:1.05rem;color:var(--creme)}
  }
  @media (max-width:600px){
    main{padding:20px 16px 50px}
    .card{padding:16px}
    .item-row{flex-wrap:wrap}
    .item-row .item-anterior{min-width:auto;order:3;flex-basis:100%;text-align:left}
  }
</style>
</head>
<body>

<div id="carregandoOverlay">Carregando…</div>

<div id="appRoot">
<div class="mobile-topbar">
  <button class="hamb" onclick="toggleSidebar()">☰</button>
  <div class="brand">LUNA <span style="font-size:.7em;font-weight:400">Inventário</span></div>
</div>
<div class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" onclick="fecharSidebar()">✕</button>
    <div class="side-header">
      <div class="brand">LUNA <span style="font-size:.7em;font-weight:400">Inventário</span></div>
      <div class="brand-sub">Inventário de Loja</div>
      <div class="field" id="seletorLojaWrap" style="display:none">
        <label>Loja</label>
        <select id="seletorLoja" class="inp" onchange="onTrocarLoja()"></select>
      </div>
    </div>
    <div class="side-links">
      <a href="https://thiagodlborges.github.io/Sistema-Luna/" class="hbtn">← Sistema Luna</a>
      <button class="hbtn" onclick="sairApp()">Sair</button>
    </div>
    <nav class="tabs">
      <div class="tab" id="tabContagem" data-tab="contagem" onclick="mudarTab('contagem')" style="display:none">📋 Nova Contagem</div>
      <div class="tab" id="tabHistorico" data-tab="historico" onclick="mudarTab('historico')" style="display:none">📜 Histórico</div>
      <div class="tab" id="tabRelatorio" data-tab="relatorio" onclick="mudarTab('relatorio')" style="display:none">📊 Relatório Consolidado</div>
      <div class="tab" id="tabInsumos" data-tab="insumos" onclick="mudarTab('insumos')" style="display:none">🧾 Itens de Insumo</div>
    </nav>
  </aside>
  <div class="content-wrap">
    <main id="mainContent"><div class="loading">Carregando…</div></main>
  </div>
</div>
</div>

<!-- Modal genérico de confirmação simples -->
<div class="modal-overlay" id="modalConfirm">
  <div class="modal">
    <h3 id="modalConfirmTitulo">Confirmar</h3>
    <p id="modalConfirmTexto" style="font-size:.88rem;color:var(--text-light);line-height:1.5"></p>
    <div class="modal-actions">
      <button class="btn" id="modalConfirmBtnOk">Confirmar</button>
      <button class="btn-outline btn" onclick="fecharModal('modalConfirm')">Cancelar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://pbuhwpcpdcnaheaywmdv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBidWh3cGNwZGNuYWhlYXl3bWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjU5MzksImV4cCI6MjA5MTg0MTkzOX0.Mg4PVg96ZiV3C2Rn0GLQU9c7ui_41OlU6Ldqn5jcvyY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PORTAL_URL = 'https://thiagodlborges.github.io/Sistema-Luna/';
const $ = id => document.getElementById(id);

const TODAS_LOJAS = ['Esplanada','Cianê','Tucuruvi','Indaiatuba','Jundiaí','Praça da Moça - Diadema','Buriti Mogi Guaçu','SP Market','Iguatemi Campinas','Shopping Itaquera','Atrium'];
const CATEGORIAS_PRECIFICACAO = ['Gelato','Potes','Confeitaria','Picolés'];
const ORDEM_CATEGORIAS = ['Gelato','Potes','Confeitaria','Picolés','Insumo'];

let meuPerfil = null;
let minhasLojas = [];
let lojaAtual = null;
let currentTab = null;
let souMaster = false;
let souBackoffice = false;
let souGerencial = false;
let temPapelDeLoja = false;

let catalogoCache = null; // { 'Gelato':[{id,nome,ativo}], ..., 'Insumo':[...] }
let contagemAtiva = null; // registro de inventario_contagens em edição
let itensAtuais = {}; // chave -> {quantidade, replicado}
let itensAnteriores = {}; // chave -> quantidade (última contagem finalizada)

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtData(d){ return d ? new Date(d+'T12:00').toLocaleDateString('pt-BR') : '—'; }
function fmtDataHora(dt){ return dt ? new Date(dt).toLocaleString('pt-BR') : '—'; }
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function fecharModal(id){ $(id).classList.remove('show'); }
function showMsg(id, txt, tipo){ const m=$(id); if(!m) return; m.textContent=txt; m.className='msg'+(txt?' show '+(tipo||''):''); }
function ultimoDiaDoMes(d){ const x = new Date(d.getFullYear(), d.getMonth()+1, 0); return x.getDate() === d.getDate(); }
function chaveItem(categoria, id){ return categoria + ':' + id; }

async function sairApp(){
  await sb.auth.signOut();
  window.location.href = PORTAL_URL;
}
function toggleSidebar(){ $('sidebar').classList.toggle('open'); $('sidebarOverlay').classList.toggle('show'); }
function fecharSidebar(){ $('sidebar').classList.remove('open'); $('sidebarOverlay').classList.remove('show'); }

function abrirModalConfirm(titulo, texto, onOk){
  $('modalConfirmTitulo').textContent = titulo;
  $('modalConfirmTexto').textContent = texto;
  const btn = $('modalConfirmBtnOk');
  const novoBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(novoBtn, btn);
  novoBtn.onclick = () => { fecharModal('modalConfirm'); onOk(); };
  $('modalConfirm').classList.add('show');
}

async function verificarAcessoEIniciar(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = PORTAL_URL; return; }

  const { data: ok, error } = await sb.rpc('tem_acesso', { p_slug: 'cmv' });
  if (error || !ok) { await sb.auth.signOut(); window.location.href = PORTAL_URL; return; }

  const { data: perfil } = await sb.from('perfis').select('*').eq('id', session.user.id).single();
  if (!perfil) { window.location.href = PORTAL_URL; return; }
  meuPerfil = perfil;

  souMaster = perfil.tipo === 'master';
  souBackoffice = souMaster || perfil.cmv_backoffice === true;
  souGerencial = souBackoffice || perfil.tipo === 'backoffice';
  temPapelDeLoja = ['loja','master_loja','master'].includes(perfil.tipo);

  if (perfil.tipo === 'master' || perfil.tipo === 'master_loja') minhasLojas = [...TODAS_LOJAS];
  else if (perfil.lojas && perfil.lojas.length) minhasLojas = perfil.lojas;
  else if (perfil.loja) minhasLojas = [perfil.loja];
  else minhasLojas = [];

  if (temPapelDeLoja && minhasLojas.length) {
    const sel = $('seletorLoja');
    sel.innerHTML = minhasLojas.map(l => '<option value="'+esc(l)+'">'+esc(l)+'</option>').join('');
    lojaAtual = minhasLojas[0];
    $('seletorLojaWrap').style.display = '';
  } else {
    temPapelDeLoja = false;
  }

  if (temPapelDeLoja) {
    $('tabContagem').style.display = '';
    $('tabHistorico').style.display = '';
  }
  if (souGerencial) {
    $('tabHistorico').style.display = '';
    $('tabRelatorio').style.display = '';
    $('tabInsumos').style.display = '';
  }

  currentTab = temPapelDeLoja ? 'contagem' : (souGerencial ? 'relatorio' : 'historico');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===currentTab));

  await carregarCatalogo();

  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('carregandoOverlay').remove();
  renderTab();
}

function onTrocarLoja(){
  lojaAtual = $('seletorLoja').value;
  contagemAtiva = null;
  renderTab();
}

function mudarTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tab));
  fecharSidebar();
  renderTab();
}

function renderTab(){
  const fns = { contagem: renderContagem, historico: renderHistorico, relatorio: renderRelatorio, insumos: renderInsumos };
  (fns[currentTab] || renderContagem)();
}

// ── CATÁLOGO (Gelato/Pote/Confeitaria/Picolé vem da Precificação; Insumo é próprio) ──
async function carregarCatalogo(){
  catalogoCache = {};
  ORDEM_CATEGORIAS.forEach(c => catalogoCache[c] = []);

  const { data: precif, error: errPrecif } = await sb.from('precificacao_produtos')
    .select('id, nome, categoria, ativo')
    .in('categoria', CATEGORIAS_PRECIFICACAO)
    .order('nome');
  if (!errPrecif && precif) {
    precif.forEach(p => {
      // Considera gelatos inativos também (pode haver estoque de sabor descontinuado);
      // demais categorias, só ativos.
      if (p.ativo || p.categoria === 'Gelato') {
        catalogoCache[p.categoria].push({ id: p.id, nome: p.nome, ativo: p.ativo, unidade: p.categoria === 'Gelato' ? 'caixa' : 'unid.' });
      }
    });
  }

  const { data: insumos, error: errInsumos } = await sb.from('inventario_insumos_catalogo')
    .select('*').eq('ativo', true).order('ordem').order('nome');
  if (!errInsumos && insumos) {
    catalogoCache['Insumo'] = insumos.map(i => ({ id: i.id, nome: i.nome, ativo: true, unidade: i.unidade }));
  }
}

function catalogoTemItens(){
  return ORDEM_CATEGORIAS.some(c => catalogoCache[c] && catalogoCache[c].length);
}

// ── ABA: NOVA CONTAGEM ────────────────────────────────────
async function renderContagem(){
  const el = $('mainContent');
  if (!lojaAtual) { el.innerHTML = '<div class="empty">Selecione uma loja.</div>'; return; }
  el.innerHTML = '<div class="loading">Carregando…</div>';

  const hoje = new Date();
  const hojeStr = hojeISO();
  const ehTerca = hoje.getDay() === 2;
  const ehUltimoDia = ultimoDiaDoMes(hoje);

  const { data: existente } = await sb.from('inventario_contagens')
    .select('*').eq('loja', lojaAtual).eq('data_contagem', hojeStr).maybeSingle();

  let bannerHtml = '';
  if (ehTerca || ehUltimoDia) {
    const motivos = [];
    if (ehTerca) motivos.push('contagem semanal (terça-feira)');
    if (ehUltimoDia) motivos.push('contagem adicional de fim de mês');
    bannerHtml = `<div class="alert-banner ok"><h4>📅 Hoje é dia de contagem</h4>Hoje é dia programado para ${motivos.join(' e ')}. </div>`;
  } else {
    bannerHtml = `<div class="alert-banner warn"><h4>Hoje não é um dia programado</h4>A contagem é semanal (terças-feiras), com uma contagem adicional no último dia do mês. Você ainda pode registrar uma contagem hoje se precisar.</div>`;
  }

  if (existente && existente.status === 'finalizada') {
    el.innerHTML = `<div class="card">${bannerHtml}
      <h2>Nova Contagem — ${esc(lojaAtual)}</h2>
      <div class="alert-banner info"><h4>✔ Contagem de hoje já finalizada</h4>A contagem de ${fmtData(hojeStr)} (${existente.tipo === 'mensal' ? 'mensal' : 'semanal'}) já foi concluída às ${fmtDataHora(existente.finalizado_em)}. Consulte no Histórico.</div>
      <button class="btn" onclick="mudarTab('historico')">Ver no Histórico</button>
    </div>`;
    return;
  }

  contagemAtiva = existente || null;

  el.innerHTML = `<div class="card">
    ${bannerHtml}
    <h2>Nova Contagem — ${esc(lojaAtual)}</h2>
    <p class="hint">Pese/conte os itens fisicamente na loja e registre aqui. Você pode salvar parcialmente e continuar depois.</p>
    <div class="row">
      <div class="field"><label>Data da contagem</label><input type="date" class="inp" id="contData" value="${existente ? existente.data_contagem : hojeStr}" ${existente ? 'disabled' : ''}></div>
      <div class="field"><label>Tipo</label>
        <select class="inp" id="contTipo" ${existente ? 'disabled' : ''}>
          <option value="semanal" ${(existente ? existente.tipo==='semanal' : !ehUltimoDia)?'selected':''}>Semanal</option>
          <option value="mensal" ${(existente ? existente.tipo==='mensal' : ehUltimoDia)?'selected':''}>Mensal (fim de mês)</option>
        </select>
      </div>
      ${!existente ? '<button class="btn" onclick="iniciarContagem()">Iniciar Contagem</button>' : ''}
    </div>
    <div id="contFormulario"></div>
  </div>`;

  if (existente) {
    await carregarFormularioContagem();
  }
}

async function iniciarContagem(){
  const data = $('contData').value;
  const tipo = $('contTipo').value;
  if (!data) { alert('Selecione a data.'); return; }

  const { data: nova, error } = await sb.from('inventario_contagens').insert({
    loja: lojaAtual, data_contagem: data, tipo,
    criado_por: meuPerfil.id, criado_por_nome: meuPerfil.nome
  }).select('*').single();

  if (error) {
    if (error.message.includes('duplicate') || error.code === '23505') {
      alert('Já existe uma contagem para esta loja nesta data. Recarregando…');
      renderContagem();
      return;
    }
    alert('Erro ao iniciar contagem: ' + error.message);
    return;
  }
  contagemAtiva = nova;
  renderContagem();
}

async function carregarFormularioContagem(){
  const wrap = $('contFormulario');
  wrap.innerHTML = '<div class="loading">Carregando itens…</div>';

  // Itens já lançados nesta contagem (rascunho)
  const { data: itensExistentes } = await sb.from('inventario_itens').select('*').eq('contagem_id', contagemAtiva.id);
  itensAtuais = {};
  (itensExistentes || []).forEach(i => {
    const id = i.precificacao_produto_id || i.insumo_id;
    itensAtuais[chaveItem(i.categoria, id)] = { quantidade: i.quantidade, replicado: i.replicado_anterior };
  });

  // Última contagem finalizada anterior a esta, pra permitir "repetir"
  const { data: anteriorHead } = await sb.from('inventario_contagens')
    .select('id').eq('loja', lojaAtual).eq('status', 'finalizada')
    .lt('data_contagem', contagemAtiva.data_contagem)
    .order('data_contagem', { ascending: false }).limit(1).maybeSingle();

  itensAnteriores = {};
  if (anteriorHead) {
    const { data: itensAnt } = await sb.from('inventario_itens').select('*').eq('contagem_id', anteriorHead.id);
    (itensAnt || []).forEach(i => {
      const id = i.precificacao_produto_id || i.insumo_id;
      itensAnteriores[chaveItem(i.categoria, id)] = i.quantidade;
    });
  }

  if (!catalogoTemItens()) {
    wrap.innerHTML = '<div class="empty">Nenhum item cadastrado ainda (verifique a Precificação e a lista de Insumos).</div>';
    return;
  }

  let html = '';
  ORDEM_CATEGORIAS.forEach(cat => {
    const itens = catalogoCache[cat] || [];
    if (!itens.length) return;
    const temAnteriorNaCategoria = itens.some(it => itensAnteriores[chaveItem(cat, it.id)] !== undefined);
    html += `<div class="categoria-titulo"><span>${esc(cat)}</span>
      ${temAnteriorNaCategoria ? `<button class="cat-repetir" onclick="repetirCategoria('${esc(cat)}')">🔁 Repetir tudo da anterior</button>` : ''}
    </div>`;
    itens.forEach(it => {
      const chave = chaveItem(cat, it.id);
      const atual = itensAtuais[chave];
      const anterior = itensAnteriores[chave];
      html += `<div class="item-row" data-chave="${esc(chave)}">
        <div class="item-nome">${esc(it.nome)}${!it.ativo ? '<span class="item-inativo-tag">inativo</span>' : ''}</div>
        <div class="item-anterior">${anterior !== undefined ? 'ant.: ' + Number(anterior) : ''}</div>
        <button type="button" class="item-repetir" title="Repetir valor anterior" onclick="repetirItem('${esc(chave)}')" ${anterior===undefined?'disabled':''}>🔁</button>
        <input type="number" min="0" step="0.01" class="item-qtd${atual&&atual.replicado?' replicado':''}" value="${atual ? atual.quantidade : ''}" data-cat="${esc(cat)}" data-id="${esc(String(it.id))}">
        <span class="item-unid">${esc(it.unidade||'')}</span>
      </div>`;
    });
  });

  wrap.innerHTML = html + `
    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
      <button class="btn btn-outline" onclick="salvarRascunho()">Salvar e Continuar Depois</button>
      <button class="btn" onclick="finalizarContagem()">Finalizar Contagem</button>
    </div>
    <div id="contMsg" class="msg"></div>`;
}

function repetirItem(chave){
  const row = document.querySelector(`.item-row[data-chave="${CSS.escape(chave)}"]`);
  if (!row) return;
  const valor = itensAnteriores[chave];
  if (valor === undefined) return;
  const input = row.querySelector('.item-qtd');
  input.value = Number(valor);
  input.classList.add('replicado');
}

function repetirCategoria(cat){
  document.querySelectorAll(`.item-row input.item-qtd[data-cat="${CSS.escape(cat)}"]`).forEach(input => {
    const row = input.closest('.item-row');
    const chave = row.dataset.chave;
    const valor = itensAnteriores[chave];
    if (valor !== undefined && !input.value) {
      input.value = Number(valor);
      input.classList.add('replicado');
    }
  });
}

function coletarLinhasFormulario(){
  return [...document.querySelectorAll('#contFormulario .item-row')].map(row => {
    const input = row.querySelector('.item-qtd');
    return {
      chave: row.dataset.chave,
      categoria: input.dataset.cat,
      id: input.dataset.id,
      quantidade: input.value === '' ? null : parseFloat(input.value),
      replicado: input.classList.contains('replicado')
    };
  });
}

async function salvarLinhas(linhas){
  const paraSalvar = linhas.filter(l => l.quantidade !== null && !isNaN(l.quantidade));
  for (const l of paraSalvar) {
    const item = (catalogoCache[l.categoria] || []).find(i => String(i.id) === l.id);
    const payload = {
      contagem_id: contagemAtiva.id,
      categoria: l.categoria,
      nome_produto: item ? item.nome : l.id,
      unidade: item ? item.unidade : null,
      quantidade: l.quantidade,
      replicado_anterior: l.replicado,
    };
    if (l.categoria === 'Insumo') payload.insumo_id = l.id; else payload.precificacao_produto_id = l.id;

    const conflictCol = l.categoria === 'Insumo' ? 'contagem_id,insumo_id' : 'contagem_id,precificacao_produto_id';
    const { error } = await sb.from('inventario_itens').upsert(payload, { onConflict: conflictCol });
    if (error) return error;
  }
  return null;
}

async function salvarRascunho(){
  const linhas = coletarLinhasFormulario();
  const btn = document.querySelector('#contFormulario button.btn-outline');
  btn.disabled = true; btn.textContent = 'Salvando…';
  const error = await salvarLinhas(linhas);
  btn.disabled = false; btn.textContent = 'Salvar e Continuar Depois';
  if (error) { showMsg('contMsg', 'Erro ao salvar: ' + error.message, 'err'); return; }
  showMsg('contMsg', 'Rascunho salvo.', 'ok');
}

async function finalizarContagem(){
  const linhas = coletarLinhasFormulario();
  const semValor = linhas.filter(l => l.quantidade === null || isNaN(l.quantidade));
  if (semValor.length) {
    abrirModalConfirm('Itens sem valor', `${semValor.length} item(ns) ficaram sem quantidade preenchida e não vão entrar na contagem. Confirma finalizar mesmo assim?`, async () => {
      await executarFinalizacao(linhas);
    });
    return;
  }
  await executarFinalizacao(linhas);
}

async function executarFinalizacao(linhas){
  showMsg('contMsg', '', '');
  const error = await salvarLinhas(linhas);
  if (error) { showMsg('contMsg', 'Erro ao salvar: ' + error.message, 'err'); return; }

  const { error: errFinal } = await sb.from('inventario_contagens')
    .update({ status: 'finalizada', finalizado_em: new Date().toISOString() })
    .eq('id', contagemAtiva.id);
  if (errFinal) { showMsg('contMsg', 'Erro ao finalizar: ' + errFinal.message, 'err'); return; }

  contagemAtiva = null;
  renderContagem();
}

// ── ABA: HISTÓRICO ────────────────────────────────────────
async function renderHistorico(){
  const el = $('mainContent');
  el.innerHTML = '<div class="loading">Carregando…</div>';

  const filtroLoja = souGerencial ? `
    <div class="field"><label>Loja</label><select class="inp" id="histFiltroLoja" onchange="carregarHistoricoLista()">
      ${souGerencial ? '<option value="">Todas as lojas</option>' : ''}
      ${TODAS_LOJAS.map(l=>'<option value="'+esc(l)+'"'+(l===lojaAtual?' selected':'')+'>'+esc(l)+'</option>').join('')}
    </select></div>` : '';

  el.innerHTML = `<div class="card">
    <h2>Histórico de Contagens</h2>
    ${filtroLoja ? '<div class="row">'+filtroLoja+'</div>' : ''}
    <div id="histLista"><div class="loading">Carregando…</div></div>
  </div>
  <div id="histDetalheWrap"></div>`;

  await carregarHistoricoLista();
}

async function carregarHistoricoLista(){
  const el = $('histLista');
  el.innerHTML = '<div class="loading">Carregando…</div>';

  let query = sb.from('inventario_contagens').select('*').order('data_contagem', { ascending: false });
  if (souGerencial) {
    const filtro = $('histFiltroLoja') ? $('histFiltroLoja').value : '';
    if (filtro) query = query.eq('loja', filtro);
  } else {
    query = query.eq('loja', lojaAtual);
  }
  const { data, error } = await query.limit(100);
  if (error) { el.innerHTML = '<div class="empty">Erro: '+esc(error.message)+'</div>'; return; }
  if (!data || !data.length) { el.innerHTML = '<div class="empty">Nenhuma contagem registrada ainda.</div>'; return; }

  el.innerHTML = `<div class="table-wrap"><table>
    <tr><th>Data</th>${souGerencial ? '<th>Loja</th>' : ''}<th>Tipo</th><th>Status</th><th>Finalizada em</th><th></th></tr>
    ${data.map(c => `<tr>
      <td>${fmtData(c.data_contagem)}</td>
      ${souGerencial ? `<td>${esc(c.loja)}</td>` : ''}
      <td><span class="badge badge-${c.tipo}">${c.tipo === 'mensal' ? 'Mensal' : 'Semanal'}</span></td>
      <td><span class="badge badge-${c.status === 'finalizada' ? 'concluido' : 'andamento'}">${c.status === 'finalizada' ? 'Finalizada' : 'Em andamento'}</span></td>
      <td>${c.finalizado_em ? fmtDataHora(c.finalizado_em) : '—'}</td>
      <td><button class="btn-sm btn" onclick="verDetalheContagem(${c.id})">Ver</button></td>
    </tr>`).join('')}
  </table></div>`;
}

async function verDetalheContagem(id){
  const wrap = $('histDetalheWrap');
  wrap.innerHTML = '<div class="card"><div class="loading">Carregando…</div></div>';
  wrap.scrollIntoView({ behavior: 'smooth' });

  const { data: cont } = await sb.from('inventario_contagens').select('*').eq('id', id).single();
  const { data: itens } = await sb.from('inventario_itens').select('*').eq('contagem_id', id).order('categoria').order('nome_produto');

  if (!cont) { wrap.innerHTML = '<div class="card"><div class="empty">Contagem não encontrada.</div></div>'; return; }

  const grupos = {};
  (itens || []).forEach(i => { (grupos[i.categoria] = grupos[i.categoria] || []).push(i); });

  wrap.innerHTML = `<div class="card">
    <h2>${esc(cont.loja)} — ${fmtData(cont.data_contagem)} <span class="badge badge-${cont.tipo}">${cont.tipo === 'mensal' ? 'Mensal' : 'Semanal'}</span></h2>
    <p class="hint">Registrado por ${esc(cont.criado_por_nome||'—')} · ${cont.status === 'finalizada' ? 'Finalizada em ' + fmtDataHora(cont.finalizado_em) : 'Em andamento'}</p>
    ${Object.keys(grupos).sort((a,b)=>ORDEM_CATEGORIAS.indexOf(a)-ORDEM_CATEGORIAS.indexOf(b)).map(cat => `
      <div class="categoria-titulo"><span>${esc(cat)}</span></div>
      <div class="table-wrap"><table>
        <tr><th>Item</th><th>Quantidade</th><th>Unidade</th></tr>
        ${grupos[cat].map(i => `<tr><td>${esc(i.nome_produto)}${i.replicado_anterior ? ' <span class="badge badge-semanal">repetido</span>' : ''}</td><td>${Number(i.quantidade)}</td><td>${esc(i.unidade||'')}</td></tr>`).join('')}
      </table></div>
    `).join('') || '<div class="empty">Nenhum item registrado nesta contagem.</div>'}
    <button class="modal-close" onclick="document.getElementById('histDetalheWrap').innerHTML=''">Fechar</button>
  </div>`;
}

// ── ABA: RELATÓRIO CONSOLIDADO (gerencial) ────────────────
async function renderRelatorio(){
  const el = $('mainContent');
  el.innerHTML = `<div class="card">
    <h2>Relatório Consolidado</h2>
    <p class="hint">Compara todas as lojas por data de contagem.</p>
    <div class="row">
      <div class="field"><label>Loja</label><select class="inp" id="relFiltroLoja" onchange="carregarRelatorio()">
        <option value="">Todas as lojas</option>
        ${TODAS_LOJAS.map(l=>'<option value="'+esc(l)+'">'+esc(l)+'</option>').join('')}
      </select></div>
      <div class="field"><label>De</label><input type="date" class="inp" id="relDataIni" onchange="carregarRelatorio()"></div>
      <div class="field"><label>Até</label><input type="date" class="inp" id="relDataFim" onchange="carregarRelatorio()"></div>
      <button class="btn btn-outline" onclick="exportarRelatorioCSV()">⬇ Exportar CSV</button>
    </div>
    <div id="relResultado"><div class="loading">Carregando…</div></div>
  </div>`;
  await carregarRelatorio();
}

let ultimoRelatorioDados = [];

async function carregarRelatorio(){
  const el = $('relResultado');
  el.innerHTML = '<div class="loading">Carregando…</div>';

  const loja = $('relFiltroLoja').value;
  const dataIni = $('relDataIni').value;
  const dataFim = $('relDataFim').value;

  let query = sb.from('inventario_contagens').select('*, inventario_itens(*)').eq('status', 'finalizada').order('data_contagem', { ascending: false });
  if (loja) query = query.eq('loja', loja);
  if (dataIni) query = query.gte('data_contagem', dataIni);
  if (dataFim) query = query.lte('data_contagem', dataFim);

  const { data, error } = await query.limit(200);
  if (error) { el.innerHTML = '<div class="empty">Erro: '+esc(error.message)+'</div>'; return; }
  if (!data || !data.length) { el.innerHTML = '<div class="empty">Nenhuma contagem finalizada no período.</div>'; ultimoRelatorioDados = []; return; }

  ultimoRelatorioDados = data;

  el.innerHTML = `<div class="table-wrap"><table>
    <tr><th>Data</th><th>Loja</th><th>Tipo</th><th>Itens contados</th><th></th></tr>
    ${data.map(c => `<tr>
      <td>${fmtData(c.data_contagem)}</td><td>${esc(c.loja)}</td>
      <td><span class="badge badge-${c.tipo}">${c.tipo === 'mensal' ? 'Mensal' : 'Semanal'}</span></td>
      <td>${(c.inventario_itens||[]).length}</td>
      <td><button class="btn-sm btn" onclick="verDetalheContagem(${c.id})">Ver</button></td>
    </tr>`).join('')}
  </table></div>
  <div id="histDetalheWrap"></div>`;
}

function exportarRelatorioCSV(){
  if (!ultimoRelatorioDados.length) { alert('Não há dados para exportar. Gere o relatório antes.'); return; }
  const esc2 = v => `"${String(v).replace(/"/g, '""')}"`;
  const linhas = [['Loja','Data','Tipo','Categoria','Item','Quantidade','Unidade','Repetido da anterior'].map(esc2).join(',')];
  ultimoRelatorioDados.forEach(c => {
    (c.inventario_itens||[]).forEach(i => {
      linhas.push([c.loja, fmtData(c.data_contagem), c.tipo, i.categoria, i.nome_produto, Number(i.quantidade), i.unidade||'', i.replicado_anterior?'Sim':'Não'].map(esc2).join(','));
    });
  });
  const csv = '\uFEFF' + linhas.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `inventario-loja-${hojeISO()}.csv`;
  a.click();
}

// ── ABA: ITENS DE INSUMO (CRUD, gerencial) ────────────────
async function renderInsumos(){
  const el = $('mainContent');
  el.innerHTML = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <h2 style="margin:0">Itens de Insumo</h2>
      <button class="btn" onclick="adicionarLinhaInsumo()">+ Novo Item</button>
    </div>
    <p class="hint">Esta lista alimenta a categoria "Insumo" nas contagens. Gelato, Pote, Confeitaria e Picolé vêm automaticamente da Precificação.</p>
    <div id="insumosLista"><div class="loading">Carregando…</div></div>
  </div>`;
  await carregarInsumos();
}

async function carregarInsumos(){
  const el = $('insumosLista');
  const { data, error } = await sb.from('inventario_insumos_catalogo').select('*').order('ordem').order('nome');
  if (error) { el.innerHTML = '<div class="empty">Erro: '+esc(error.message)+'</div>'; return; }
  if (!data || !data.length) { el.innerHTML = '<div class="empty">Nenhum insumo cadastrado ainda. Clique em "+ Novo Item" para começar.</div>'; return; }

  el.innerHTML = `<div class="table-wrap"><table>
    <tr><th>Nome</th><th>Unidade</th><th>Ativo</th><th></th></tr>
    ${data.map(i => `<tr class="${i.ativo?'':'inativo'}" data-id="${i.id}">
      <td><input class="inp" style="width:100%;min-width:180px" value="${esc(i.nome)}" data-field="nome"></td>
      <td><input class="inp" style="width:90px" value="${esc(i.unidade)}" data-field="unidade"></td>
      <td><input type="checkbox" ${i.ativo?'checked':''} data-field="ativo"></td>
      <td style="white-space:nowrap">
        <button class="btn-sm btn" onclick="salvarInsumo('${i.id}')">Salvar</button>
        <button class="btn-danger" onclick="excluirInsumo('${i.id}')">🗑</button>
      </td>
    </tr>`).join('')}
  </table></div>`;
}

function adicionarLinhaInsumo(){
  const el = $('insumosLista');
  if (el.querySelector('table')) {
    const tbl = el.querySelector('table');
    const tr = document.createElement('tr');
    tr.dataset.id = 'novo';
    tr.innerHTML = `<td><input class="inp" style="width:100%;min-width:180px" placeholder="Nome do insumo" data-field="nome"></td>
      <td><input class="inp" style="width:90px" value="unid." data-field="unidade"></td>
      <td><input type="checkbox" checked data-field="ativo"></td>
      <td><button class="btn-sm btn" onclick="salvarInsumo('novo', this)">Salvar</button></td>`;
    tbl.appendChild(tr);
    tr.querySelector('input').focus();
  } else {
    el.innerHTML = `<div class="table-wrap"><table>
      <tr><th>Nome</th><th>Unidade</th><th>Ativo</th><th></th></tr>
      <tr data-id="novo">
        <td><input class="inp" style="width:100%;min-width:180px" placeholder="Nome do insumo" data-field="nome"></td>
        <td><input class="inp" style="width:90px" value="unid." data-field="unidade"></td>
        <td><input type="checkbox" checked data-field="ativo"></td>
        <td><button class="btn-sm btn" onclick="salvarInsumo('novo', this)">Salvar</button></td>
      </tr>
    </table></div>`;
  }
}

async function salvarInsumo(id, btnEl){
  const tr = (btnEl ? btnEl.closest('tr') : document.querySelector(`tr[data-id="${id}"]`));
  const nome = tr.querySelector('[data-field="nome"]').value.trim();
  const unidade = tr.querySelector('[data-field="unidade"]').value.trim() || 'unid.';
  const ativo = tr.querySelector('[data-field="ativo"]').checked;
  if (!nome) { alert('Informe o nome do insumo.'); return; }

  if (id === 'novo') {
    const { error } = await sb.from('inventario_insumos_catalogo').insert({ nome, unidade, ativo, criado_por: meuPerfil.id, criado_por_nome: meuPerfil.nome });
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
  } else {
    const { error } = await sb.from('inventario_insumos_catalogo').update({ nome, unidade, ativo }).eq('id', id);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
  }
  await carregarCatalogo();
  await carregarInsumos();
}

async function excluirInsumo(id){
  abrirModalConfirm('Excluir insumo', 'Remover este item da lista de insumos? Contagens já finalizadas que usaram este item continuam com o histórico preservado.', async () => {
    const { error } = await sb.from('inventario_insumos_catalogo').delete().eq('id', id);
    if (error) { alert('Erro ao excluir: ' + error.message); return; }
    await carregarCatalogo();
    await carregarInsumos();
  });
}

sb.auth.getSession().then(({ data }) => { if (data && data.session) verificarAcessoEIniciar(); else window.location.href = PORTAL_URL; });
</script>
